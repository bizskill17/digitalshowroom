<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Digital Showroom</title><link rel="stylesheet" href="/assets/style.css?v=mobile-close-aligned-1"><style>
/* Always protect desktop grid even while a cached stylesheet is loading. */
.mobile-dashboard-header,.mobile-nav-backdrop,.mobile-nav-close{display:none}
@media(max-width:800px){
 .app-shell{display:block!important;width:100%;min-width:0}
 .mobile-dashboard-header{display:flex;position:sticky;top:0;z-index:60;align-items:center;gap:10px;background:#083e83;color:#fff;padding:9px 14px;min-height:58px}
 .mobile-nav-toggle{display:grid;place-items:center;width:39px;height:39px;min-width:39px;border-radius:9px;background:#176ac0;color:#fff;border:1px solid #ffffff44;font-size:21px}
 .mobile-dashboard-brand{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:800;color:#fff}
 .mobile-dashboard-brand .mark{background:#0963de;padding:5px;border-radius:7px}
 .mobile-nav-backdrop:not([hidden]){display:block;position:fixed;inset:0;z-index:69;background:#061c39a8;border:0;width:100%;height:100dvh}
 .app-shell>.sidebar{position:fixed!important;left:0;top:0;bottom:0;width:min(290px,86vw);max-width:86vw;height:100dvh;min-height:0;z-index:70;transform:translateX(-105%);visibility:hidden;pointer-events:none}
 .app-shell>.sidebar.mobile-nav-open{transform:translateX(0);visibility:visible;pointer-events:auto}
 .mobile-nav-close{display:grid;place-items:center;position:absolute;right:12px;top:12px;width:34px;height:34px;color:white;background:#ffffff24;border:1px solid #ffffff55;border-radius:9px;font-size:25px}
 .app-shell>.app-main{width:100%;max-width:100%;min-width:0}
}
</style></head><body>
<header class="mobile-dashboard-header"><button type="button" id="mobileNavToggle" class="mobile-nav-toggle" aria-label="Open navigation menu" aria-controls="sideNav" aria-expanded="false"><span aria-hidden="true">☰</span></button><a href="/" class="mobile-dashboard-brand"><span>Digital Showroom</span></a></header><button type="button" id="mobileNavBackdrop" class="mobile-nav-backdrop" aria-label="Close navigation menu" hidden></button><div class="app-shell"><aside class="sidebar" id="dashboardSidebar"><button type="button" id="mobileNavClose" class="mobile-nav-close" aria-label="Close navigation menu">×</button><a class="brand" href="/"><span>Digital Showroom</span></a><nav id="sideNav"></nav><div class="sidebar-account"><div class="account-card"><div class="account-identity"><div class="account-avatar" id="userInitials" aria-hidden="true"></div><div class="account-info"><span id="userName"></span><small id="userRole"></small></div></div><button type="button" id="logout" class="sidebar-logout"><span aria-hidden="true">↪</span> Log out</button></div></div></aside>
<div class="app-main"><header class="app-header"><div><h1 id="pageTitle">Dashboard</h1></div></header><div id="flash" aria-live="polite"></div><div id="content"><div class="panel">Loading your dashboard…</div></div></div></div>
<script src="/assets/status-maker.js?v=status-maker-2" defer></script>
<script src="/assets/dashboard.js?v=mobile-dashboard-drawer-2" defer onerror="document.getElementById('content').textContent='Dashboard script failed to load. Refresh this page.'"></script></body></html>
