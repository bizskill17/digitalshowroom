<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login or Create Shop | Digital Showroom</title><link rel="stylesheet" href="/assets/style.css"><style>.password-control{position:relative}.password-control input{padding-right:48px}.password-toggle{position:absolute;right:5px;top:50%;transform:translateY(-50%);height:34px;width:38px;display:grid;place-items:center;background:transparent;border:0;border-radius:7px;color:#607795}.password-toggle:hover{background:#eaf3ff;color:#0862df}.password-toggle:focus-visible{outline:2px solid #0862df;outline-offset:1px}</style></head><body><main class="auth"><div class="auth-card"><a class="brand" href="/"><span class="mark">▣</span> Digital Showroom</a><h1 id="formTitle">Welcome Back</h1><p class="muted" id="formSubtitle">Sign in to manage your shop.</p><div class="switch"><button class="btn primary" id="loginTab" type="button">Login</button><button class="btn soft" id="registerTab" type="button">Create Your Shop</button></div><div id="message" aria-live="polite"></div><form id="accountForm"><div id="registerFields" hidden><div class="form-grid"><div class="field"><label for="name">Your Name *</label><input id="name" maxlength="150" autocomplete="name"></div><div class="field"><label for="phone">WhatsApp Number *</label><input id="phone" inputmode="tel" maxlength="15"></div></div><div class="field"><label for="shopName">Shop Name *</label><input id="shopName" maxlength="150"></div><div class="field"><label for="slug">Shop Link *</label><input id="slug" maxlength="90" placeholder="e.g. my-bakery"><small class="hint">Your public URL: showroom.bizskilledu.com/shop.html?slug=<span id="slugPreview">your-shop</span></small></div></div><div class="field"><label for="email">Email *</label><input id="email" type="email" autocomplete="email" required maxlength="190"></div><div class="field"><label for="password">Password *</label><div class="password-control"><input id="password" type="password" required autocomplete="current-password"><button id="togglePassword" type="button" class="password-toggle" aria-label="Show password" aria-pressed="false" title="Show password"><svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div><button id="submitBtn" class="btn primary wide" type="submit">Login</button></form><p class="hint" style="margin-top:20px"><a href="/">← Back to Digital Showroom</a></p></div></main><script src="/assets/login.js?v=51da86a" defer></script><script>document.getElementById("togglePassword").addEventListener("click",function(){const input=document.getElementById("password");const show=input.type==="password";input.type=show?"text":"password";this.setAttribute("aria-label",show?"Hide password":"Show password");this.setAttribute("title",show?"Hide password":"Show password");this.setAttribute("aria-pressed",String(show));document.getElementById("eyeIcon").innerHTML=show?'<path d="M3 3l18 18"/><path d="M10.6 5.1A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.1"/><path d="M6.3 6.3C3.6 8.3 2 12 2 12s3.5 7 10 7a10.7 10.7 0 0 0 4.1-.8"/><path d="M10 10a3 3 0 0 0 4 4"/>':'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>';});</script></body></html>
