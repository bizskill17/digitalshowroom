<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login or Create Shop | Digital Showroom</title><link rel="stylesheet" href="/assets/style.css"></head><body><main class="auth"><div class="auth-card"><a class="brand" href="/"><span class="mark">▣</span> Digital Showroom</a><h1 id="formTitle">Welcome Back</h1><p class="muted" id="formSubtitle">Sign in to manage your shop.</p><div class="switch"><button class="btn primary" id="loginTab" type="button">Login</button><button class="btn soft" id="registerTab" type="button">Create Your Shop</button></div><div id="message" aria-live="polite"></div><form id="accountForm"><div id="registerFields" hidden><div class="form-grid"><div class="field"><label for="name">Your Name *</label><input id="name" maxlength="150" autocomplete="name"></div><div class="field"><label for="phone">WhatsApp Number *</label><input id="phone" inputmode="tel" maxlength="15"></div></div><div class="field"><label for="shopName">Shop Name *</label><input id="shopName" maxlength="150"></div><div class="field"><label for="slug">Shop Link *</label><input id="slug" maxlength="90" placeholder="e.g. my-bakery"><small class="hint">Your public URL: showroom.bizskilledu.com/shop.html?slug=<span id="slugPreview">your-shop</span></small></div></div><div class="field"><label for="email">Email *</label><input id="email" type="email" autocomplete="email" required maxlength="190"></div><div class="field"><label for="password">Password *</label><input id="password" type="password" required autocomplete="current-password"></div><button id="submitBtn" class="btn primary wide" type="submit">Login</button></form><p class="hint" style="margin-top:20px"><a href="/">← Back to Digital Showroom</a></p></div></main><script src="/assets/login.js" defer></script></body></html>
