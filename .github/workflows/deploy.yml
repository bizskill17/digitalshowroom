name: Deploy Digital Showroom to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: digitalshowroom-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FTPS client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lftp

      - name: Upload website using passive FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p 21 "$FTP_SERVER" <<'LFTP'
          set cmd:fail-exit yes
          set ftp:ssl-allow yes
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          # Hostinger displays an IP as FTP host; its TLS certificate has a DNS name.
          # Keep CA chain verification enabled, but do not require the IP to match CN/SAN.
          set ssl:verify-certificate yes
          set ssl:check-hostname no
          set ftp:passive-mode yes
          set ftp:prefer-epsv no
          set net:max-retries 2
          set net:timeout 20
          mirror --reverse --verbose --only-newer --exclude-glob .git/ --exclude-glob .github/ --exclude-glob README.md --exclude-glob node_modules/ ./ ./public_html/
          bye
          LFTP
