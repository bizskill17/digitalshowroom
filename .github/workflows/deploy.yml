name: Deploy Digital Showroom to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: digitalshowroom-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate application code
        run: |
          php -l api/app.php
          php -l api/upload.php
          php -l api/db.php
          php -l api/health.php
          node --check assets/login.js
          node --check assets/dashboard.js
          node --check assets/shop.js

      - name: Install FTPS client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lftp

      - name: Prepare private database configuration
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          keys = ['DB_HOST', 'DB_NAME', 'DB_USER', 'DB_PASSWORD']
          if any(not os.environ.get(key) for key in keys):
              raise SystemExit('Missing a required DB_* GitHub Actions secret')

          def php_value(key):
              encoded = base64.b64encode(os.environ[key].encode('utf-8')).decode('ascii')
              return "base64_decode('" + encoded + "')"

          config = ("<?php\nreturn [\n"
                    + "    'host' => " + php_value('DB_HOST') + ",\n"
                    + "    'name' => " + php_value('DB_NAME') + ",\n"
                    + "    'user' => " + php_value('DB_USER') + ",\n"
                    + "    'password' => " + php_value('DB_PASSWORD') + ",\n"
                    + "];\n")
          file = Path('/tmp/showroom-db-config.php')
          file.write_text(config, encoding='utf-8')
          file.chmod(0o600)
          PY

      - name: Prepare private directory access restrictions
        run: |
          cat > /tmp/showroom-private-htaccess <<'HTACCESS'
          <IfModule mod_authz_core.c>
          Require all denied
          </IfModule>
          <IfModule !mod_authz_core.c>
          Deny from all
          </IfModule>
          HTACCESS

      - name: Upload website and protected config using passive FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p 21 "$FTP_SERVER" <<'LFTP'
          set cmd:fail-exit yes
          set ftp:ssl-allow yes
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          # Hostinger's supplied FTP IP does not match its certificate hostname.
          # CA verification remains enabled; hostname checking is a temporary exception.
          set ssl:verify-certificate yes
          set ssl:check-hostname no
          set ftp:passive-mode yes
          set ftp:prefer-epsv no
          set net:max-retries 2
          set net:timeout 20
          mkdir -f ./showroom-private
          put /tmp/showroom-private-htaccess -o ./showroom-private/.htaccess
          put /tmp/showroom-db-config.php -o ./showroom-private/db-config.php
          mirror --reverse --verbose --only-newer --exclude-glob .git/ --exclude-glob .github/ --exclude-glob README.md --exclude-glob node_modules/ ./ ./
          bye
          LFTP
