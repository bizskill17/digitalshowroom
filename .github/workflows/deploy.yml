name: Deploy Digital Showroom to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: digitalshowroom-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate application code
        run: |
          php -l api/app.php
          php -l api/admin-setup.php
          node --check assets/admin-setup.js
          php -l api/upload.php
          php -l api/db.php
          php -l api/health.php
          php -l scripts/backup.php
          node --check assets/login.js
          node --check assets/admin-login.js
          node --check assets/dashboard.js
          node --check assets/status-maker.js
          node --check assets/shop.js

      - name: Verify deployment does not contain persistent data or secrets
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^showroom-private/|^uploads/.*\.(jpg|jpeg|png|webp|gif|svg)$|(^|/)db-config\.php$|(^|/)admin-setup-config\.php$|\.sql(\.gz)?$)' ; then
            echo "::error::Private configuration, uploaded media or database dumps must never be committed."
            exit 1
          fi
          test -f uploads/.htaccess
          test -f api/db.php

      - name: Install FTPS client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lftp

      - name: Prepare private database configuration
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          ADMIN_SETUP_TOKEN: ${{ secrets.ADMIN_SETUP_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          keys = ['DB_HOST', 'DB_NAME', 'DB_USER', 'DB_PASSWORD']
          if any(not os.environ.get(key) for key in keys):
              raise SystemExit('Missing a required DB_* GitHub Actions secret')

          def php_value(key):
              encoded = base64.b64encode(os.environ[key].encode('utf-8')).decode('ascii')
              return "base64_decode('" + encoded + "')"

          config = ("<?php\nreturn [\n"
                    + "    'host' => " + php_value('DB_HOST') + ",\n"
                    + "    'name' => " + php_value('DB_NAME') + ",\n"
                    + "    'user' => " + php_value('DB_USER') + ",\n"
                    + "    'password' => " + php_value('DB_PASSWORD') + ",\n"
                    + "];\n")
          file = Path('/tmp/showroom-db-config.php')
          file.write_text(config, encoding='utf-8')
          file.chmod(0o600)

          import hashlib
          setup_token = os.environ.get('ADMIN_SETUP_TOKEN', '')
          if setup_token and len(setup_token) < 32:
              raise SystemExit('ADMIN_SETUP_TOKEN must be at least 32 characters')
          token_hash = hashlib.sha256(setup_token.encode('utf-8')).hexdigest() if setup_token else ''
          setup_file = Path('/tmp/showroom-admin-setup-config.php')
          setup_file.write_text("<?php\nreturn '" + token_hash + "';\n", encoding='utf-8')
          setup_file.chmod(0o600)
          PY

      - name: Prepare private directory access restrictions
        run: |
          cat > /tmp/showroom-private-htaccess <<'HTACCESS'
          <IfModule mod_authz_core.c>
          Require all denied
          </IfModule>
          <IfModule !mod_authz_core.c>
          Deny from all
          </IfModule>
          HTACCESS

      - name: Upload website and protected config using passive FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p 21 "$FTP_SERVER" <<'LFTP'
          set cmd:fail-exit yes
          set ftp:ssl-allow yes
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          # Hostinger's supplied FTP IP does not match its certificate hostname.
          # CA verification remains enabled; hostname checking is a temporary exception.
          set ssl:verify-certificate yes
          set ssl:check-hostname no
          set ftp:passive-mode yes
          set ftp:prefer-epsv no
          set net:max-retries 2
          set net:timeout 20
          mkdir -f ./showroom-private
          put /tmp/showroom-private-htaccess -o ./showroom-private/.htaccess
          put /tmp/showroom-db-config.php -o ./showroom-private/db-config.php
          put /tmp/showroom-admin-setup-config.php -o ./showroom-private/admin-setup-config.php
          # Non-destructive deploy: do not use --delete; shop uploads and private config persist on the server.
          mirror --reverse --verbose --only-newer --exclude-glob .git/ --exclude-glob .github/ --exclude-glob .gitignore --exclude-glob README.md --exclude-glob node_modules/ ./ ./
          # Always replace the dashboard assets; FTP timestamps can otherwise leave older code in place.
          put assets/dashboard.js -o ./assets/dashboard.js
          put assets/status-maker.js -o ./assets/status-maker.js
          put assets/style.css -o ./assets/style.css
          # Remove only obsolete Share Kit code; never touch seller uploads or protected config.
          rm -f ./assets/share-kit.js
          rm -f ./assets/vendor/qrcode.min.js
          rm -f ./assets/vendor/QRCodeJS-LICENSE.txt
          put dashboard.html -o ./dashboard.html
          # Ensure new friendly shop routes and public assets are not skipped by FTP timestamp differences.
          put .htaccess -o ./.htaccess
          put shop.html -o ./shop.html
          put assets/shop.js -o ./assets/shop.js
          put assets/login.js -o ./assets/login.js
          bye
          LFTP

      - name: Verify protected database config is inaccessible from the web
        shell: bash
        run: |
          set -euo pipefail
          for path in showroom-private/db-config.php showroom-private/admin-setup-config.php; do
            status=$(curl --silent --show-error --max-time 15 --output /dev/null --write-out '%{http_code}' "https://showroom.bizskilledu.com/$path")
            case "$status" in
              401|403|404) echo "Protected: /$path (HTTP $status)" ;;
              *) echo "::error::Private config /$path is not confirmed blocked (HTTP $status). Investigate hosting access rules."; exit 1 ;;
            esac
          done
