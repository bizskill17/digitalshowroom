<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop | Digital Showroom</title><link rel="stylesheet" href="/assets/style.css?v=phase2-enquiry-inbox-1"></head><body class="shop-view"><div class="shop-banner"><a href="/" class="brand" style="font-size:17px"><span class="mark">▣</span> Digital Showroom</a><a href="/login.html" class="muted">Create Your Shop</a></div><header id="shopHeader" class="shop-header"><h1>Loading Shop…</h1></header><main class="shop-main"><h2>Our Products</h2><div id="filter" class="shop-filter"></div><div id="products" class="shop-products"></div><div id="shopError" aria-live="polite"></div></main><div class="shop-cart"><div><b id="selectedCount">No items selected</b><small id="selectedTotal" style="display:block" class="muted">Select products to enquire</small></div><div class="inline-actions"><button class="btn primary" id="orderBtn">💬 Send Order on WhatsApp</button><button class="btn soft" id="quoteBtn">Get Quotation</button></div></div><dialog id="enquiryDialog" class="enquiry-dialog" aria-labelledby="enquiryDialogTitle"><form id="enquiryForm"><div class="enquiry-dialog-head"><h2 id="enquiryDialogTitle">Customer Details</h2><button type="button" id="enquiryClose" aria-label="Close" class="enquiry-close">×</button></div><div class="field"><label for="customerName">Customer Name <span aria-hidden="true">*</span></label><input id="customerName" name="customer_name" type="text" maxlength="120" autocomplete="name" required></div><div class="field"><label for="customerMobile">Mobile Number <span aria-hidden="true">*</span></label><input id="customerMobile" name="customer_mobile" type="tel" inputmode="numeric" maxlength="10" minlength="10" pattern="[0-9]{10}" autocomplete="tel-national" title="Enter a 10-digit mobile number" required></div><div id="enquiryMessage" class="enquiry-error" role="alert" hidden></div><div class="enquiry-dialog-actions"><button type="button" id="enquiryCancel" class="btn soft">Cancel</button><button type="submit" id="enquiryContinue" class="btn primary">Continue to WhatsApp</button></div></form></dialog><script src="/assets/shop.js?v=phase2-enquiry-inbox-1" defer></script></body></html>
